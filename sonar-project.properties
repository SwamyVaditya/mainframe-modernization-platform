sonar.projectKey=SwamyVaditya_mainframe-modernization-platform
sonar.organization=swamyvaditya
sonar.projectName=mainframe-modernization-platform
sonar.projectVersion=1.0

# Sources - Production-grade exclusions
sonar.sources=.
sonar.exclusions=**/zowe.config.*,**/.zowe/**,**/*.log,**/BuildReport.json,**/build_artifacts/**,**/wazi_test/**,**/.git/**,**/node_modules/**,**/*.html
sonar.cobol.copy.directories=copybooks
sonar.cobol.file.suffixes=cbl,cob,cpy
sonar.sourceEncoding=IBM1047

# Quality Gate - Production requirement
sonar.qualitygate.wait=true

# Coverage - Production requirement 80%
sonar.coverage.exclusions=**/test/**,**/*ZUNIT*

# Security - Disable false positive SHA pinning rule for workflows (already pinned to full SHA)
# Rule githubactions:S763 flags even with full SHA - marked as False Positive in SonarCloud UI
sonar.issue.ignore.multicriteria=s1
sonar.issue.ignore.multicriteria.s1.ruleKey=githubactions:S763
sonar.issue.ignore.multicriteria.s1.resourceKey=**/.github/workflows/**

# For portfolio - Document enterprise decisions
sonar.links.homepage=https://github.com/SwamyVaditya/mainframe-modernization-platform
sonar.links.ci=https://github.com/SwamyVaditya/mainframe-modernization-platform/actions
sonar.links.scm=https://github.com/SwamyVaditya/mainframe-modernization-platform
