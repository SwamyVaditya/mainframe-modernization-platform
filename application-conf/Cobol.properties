# Hybrid - COBOL/COPY/OBJ/DBRM = PDS, LOAD = PDSE LIBRARY, BMS = BUILD.COPY
cobol_fileBuildRank=
cobol_compilerVersion=V6
cobol_compileMaxRC=4
cobol_linkEditMaxRC=4
cobol_compileParms=LIB,SSRANGE
cobol_linkEditParms=MAP,RENT,COMPAT(PM5)
cobol_linkEdit=true
cobol_storeSSI=true
cobol_identifyLoad=true
cobol_deployType=LOAD
cobol_scanLoadModule=true
cobol_dependencySearch=${copybookSearch}
cobol_requiredBuildProperties=cobol_srcPDS,cobol_cpyPDS,cobol_objPDS,cobol_loadPDS,cobol_compiler,cobol_linkEditor,cobol_tempOptions,applicationOutputsCollectionName
cobol_srcOptions=tracks space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dir(5)
cobol_tempOptions=tracks space(1,1) unit(vio) lrecl(80) recfm(F,B) new
cobol_printTempOptions=tracks space(1,1) unit(vio) lrecl(133) recfm(F,B) new
cobol_compileErrorFeedbackXmlOptions=tracks space(1,1) dsorg(PS) blksize(27998) lrecl(16383) recfm(V,B) new keep
cobol_loadOptions=tracks space(1,5) dsorg(PO) recfm(U) blksize(32760) dir(5) dsntype(library)
cobol_BMS_PDS=Z78651.BUILD.COPY
cobol_compiler=IGYCRCTL
cobol_linkEditor=IEWBLINK
# CORRECT for Xplore from LISTALC - IGY650 is COBOL 6.5.0
SIGYCOMP_V6=IGY650.SIGYCOMP
SIGYCOMP_V4=IGY650.SIGYCOMP
SDFHCOB=IGY650.SIGYCOMP
SDFHLOAD=DFH.V5R6M0.CICS.SDFHLOAD
SDSNLOAD=DSN.V12R1M0.SDSNLOAD
# Binder - try CEE.SCEELKED which exists in LISTALC as CEE.SCEERUN pattern
SCEELKED=CEE.SCEELKED
SCEELKEX=CEE.SCEELKED
