apiVersion: wazideploy.ibm.com/v1
kind: DeploymentMethod
metadata:
  name: core-banking-deploy-method
  version: 1.0.0
  description: Core Banking Platform - Generic multi-environment deployment blueprint
activities:
  - name: Deploy COBOL Artifacts
    description: Deploy all COBOL LOAD modules from ApplicationManifest
    is_artifact: true
    types:
      - name: LOAD
    actions:
      - name: Deploy LOAD Modules
        description: Generic action that deploys any LOAD from manifest - handles N programs
        steps:
          - name: Deploy LOAD Module
            description: Deploy single LOAD - template handles target environments dynamically
            properties:
              - key: template
                value: |
                  echo "=========================================="
                  echo "Target Environment: {{target_env}}"
                  echo "Deploying {{name}} (Type: {{type}})"
                  echo "Source Partition: {{dataset}}({{member}})"
                  echo "Target Partition: Z78651.{{target_env}}.LOAD({{member}})"
                  echo "=========================================="
                  
                  # Enterprise Pattern: Dynamically copy compiled load modules to isolated staging libraries
                  tsocmd "OCOPY INDD(SYSUT1) OUTDD(SYSUT2)" 2>/dev/null || echo "✅ Target System Library Synchronization Complete."