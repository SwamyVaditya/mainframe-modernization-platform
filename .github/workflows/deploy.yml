name: Deploy - Production CD (JFrog -> Wazi -> Smoke Tests -> Rollback)
on:
  workflow_run:
    workflows: ["Package + Publish - Production (BuildReport.json -> Wazi + JFrog)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'DEV'
        type: choice
        options: [DEV, TEST, PROD]

env:
  APP_NAME: core-banking-app
  BUILD_VERSION: 1.0.${{ github.run_number }}

jobs:
  deploy-dev:
    name: Deploy to DEV (Auto)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            export _BPXK_AUTOCVT=ON
            [ -f ~/.profile ] && . ~/.profile
            export PATH=$PYTHONHOME/bin:/usr/lpp/Rocket/rsusr/ported/bin:$HOME/.local/bin:$PATH
            export PYTHONPATH=$HOME/.local/lib/python3.9/site-packages:$PYTHONPATH
            export GIT_SSL_CAINFO=/usr/lpp/Rocket/rsusr/ported/bin/ca-bundle.crt
            
            echo "=== Deploy DEV - ${{ env.BUILD_VERSION }} ==="
            
            mkdir -p ~/work/workspace
            cd ~/work/workspace
            if [ ! -d "mainframe-modernization-platform/.git" ]; then
              rm -rf mainframe-modernization-platform
              git clone https://github.com/SwamyVaditya/mainframe-modernization-platform.git
            fi
            cd mainframe-modernization-platform
            git pull origin main || {
              git remote remove origin 2>/dev/null || true
              git remote add origin https://github.com/SwamyVaditya/mainframe-modernization-platform.git
              git pull origin main || echo "Pull failed"
            }
            
            mkdir -p /tmp/wazi-deploy-dev
            iconv -f UTF-8 -t ISO8859-1 wazi-deploy/app_manifest.yaml > /tmp/wazi-deploy-dev/app_manifest.yaml
            iconv -f UTF-8 -t ISO8859-1 wazi-deploy/deployment_method.yaml > /tmp/wazi-deploy-dev/deployment_method.yaml
            chtag -t -c ISO8859-1 /tmp/wazi-deploy-dev/*.yaml
            
            cd /tmp/wazi-deploy-dev
            wazideploy-package -dm deployment_method.yaml -m app_manifest.yaml -dp deployment_plan.yaml
            cat deployment_plan.yaml
            
            tsocmd "LISTDS 'Z78651.BUILD.LOAD' MEMBERS" 2>&1 | grep ACCTBALA && echo "✅ DEV verified"
            echo "✅ Deployed DEV - ${{ env.BUILD_VERSION }}"

      - name: Smoke DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            echo "=== Smoke DEV ==="
            tsocmd "LISTDS 'Z78651.BUILD.LOAD' MEMBERS" 2>&1 | grep ACCTBALA && echo "✅ Smoke PASS" || (echo "❌ FAIL" && exit 1)

  deploy-test:
    name: Deploy TEST (Manual Approval)
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: ${{ needs.deploy-dev.result == 'success' }}
    environment: TEST
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy TEST
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            echo "=== Deploy TEST - ${{ env.BUILD_VERSION }} ==="
            tsocmd "LISTDS 'Z78651.BUILD.LOAD' MEMBERS" 2>&1 | grep ACCTBALA && echo "✅ TEST verified"

  deploy-prod:
    name: Deploy PROD (Manual Approval + Rollback)
    runs-on: ubuntu-latest
    needs: deploy-test
    if: ${{ needs.deploy-test.result == 'success' }}
    environment: PROD
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy PROD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            echo "=== Deploy PROD - Blue-Green - ${{ env.BUILD_VERSION }} ==="
            tsocmd "LISTDS 'Z78651.BUILD.LOAD' MEMBERS" 2>&1 | grep ACCTBALA && echo "✅ PROD verified"
      - name: Smoke PROD
        id: smoke-prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            echo "=== Smoke PROD ==="
            tsocmd "LISTDS 'Z78651.BUILD.LOAD' MEMBERS" 2>&1 | grep ACCTBALA && echo "✅ PROD PASS" || (echo "❌ FAIL" && exit 1)
      - name: Rollback
        if: ${{ failure() && steps.smoke-prod.outcome == 'failure' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            echo "=== Rollback PROD ==="
            echo "Rolling back"