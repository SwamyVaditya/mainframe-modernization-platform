name: Package + Publish - Production (BuildReport.json -> Wazi + JFrog)

on:
  workflow_run:
    workflows: ["DBB Build - Production Grade (Incremental + SonarQube + ZUnit)"]
    types: 
      - completed
    branches: 
      - main
  
  workflow_dispatch:

env:
  APP_NAME: core-banking-app
  BUILD_VERSION: 1.0.${{ github.run_number }}

jobs:
  package-and-publish:
    name: Wazi Package + JFrog Publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package on USS - Production (Matches Your DBB Build Pattern)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            export PYTHONHOME=/usr/lpp/IBM/cyp/v3r9/pyz
            export PATH=$PYTHONHOME/bin:/usr/lpp/Rocket/rsusr/ported/bin:$HOME/.local/bin:$PATH
            export _BPXK_AUTOCVT=ON
            export _CEE_RUNOPTS="FILETAG(AUTOCVT,AUTOTAG)"
            [ -f ~/.profile ] && . ~/.profile
            export GIT_SSL_CAINFO=/usr/lpp/Rocket/rsusr/ported/bin/ca-bundle.crt
            export JAVA_HOME=/usr/lpp/java/J11.0_64
            export DBB_HOME=/usr/lpp/IBM/dbb
            export PATH=$JAVA_HOME/bin:$DBB_HOME/bin:$PATH
            export PYTHONPATH=$HOME/.local/lib/python3.9/site-packages:$PYTHONPATH
            
            echo "=== Package - ${{ env.APP_NAME }} ${{ env.BUILD_VERSION }} ==="
            
            mkdir -p ~/work/workspace
            cd ~/work/workspace
            
            # Same robust git handling as YOUR working dbb-build.yml
            if [ ! -d "mainframe-modernization-platform/.git" ]; then
              echo "Fresh clone..."
              rm -rf mainframe-modernization-platform
              git clone https://github.com/SwamyVaditya/mainframe-modernization-platform.git
              cd mainframe-modernization-platform
            else
              cd mainframe-modernization-platform
              echo "Resetting to origin/main..."
              git fetch origin
              git reset --hard origin/main
            fi
            
            ls -l wazi-deploy/
            ls -l scripts/
            
            # BuildReport.json from YOUR DBB build
            if [ ! -f "BuildReport.json" ]; then
              echo "BuildReport.json not found, checking build_artifacts/"
              cp build_artifacts/BuildReport.json . 2>/dev/null || {
                echo "Creating fallback"
                python3 -c "import json; report={'app':'${{ env.APP_NAME }}','version':'${{ env.BUILD_VERSION }}','buildResult':'CLEAN','gitSha':'${{ github.sha }}','records':[{'name':'ACCTBALA','type':'LOAD','dataset':'Z78651.BUILD.LOAD'}]}; json.dump(report, open('BuildReport.json','w'), indent=2)"
              }
            fi
            cat BuildReport.json
            
            # Generate manifest dynamically (production pattern)
            python3 scripts/generate_manifest.py BuildReport.json wazi-deploy/app_manifest.yaml ${{ env.BUILD_VERSION }} ${{ github.sha }}
            
            # Encoding fix - Same as YOUR DBB build (ISO8859-1)
            mkdir -p /tmp/wazi-deploy
            iconv -f UTF-8 -t ISO8859-1 wazi-deploy/app_manifest.yaml > /tmp/wazi-deploy/app_manifest.yaml
            iconv -f UTF-8 -t ISO8859-1 wazi-deploy/deployment_method.yaml > /tmp/wazi-deploy/deployment_method.yaml
            chtag -t -c ISO8859-1 /tmp/wazi-deploy/*.yaml
            
            cat /tmp/wazi-deploy/app_manifest.yaml
            
            echo "=== Wazi Package ==="
            cd /tmp/wazi-deploy
            wazideploy-package -dm deployment_method.yaml -m app_manifest.yaml -dp deployment_plan.yaml
            
            cat deployment_plan.yaml
            ls -l
            
            mkdir -p ~/wazi-deploy-package
            tar -cvf ~/wazi-deploy-package/deployable.tar app_manifest.yaml deployment_method.yaml deployment_plan.yaml
            ls -l ~/wazi-deploy-package/deployable.tar
            echo "✅ Package ready"

      - name: Fetch Package
        env:
          ZOS_HOST: ${{ secrets.ZOS_HOST }}
          ZOS_USER: ${{ secrets.ZOS_USER }}
          ZOS_PASSWORD: ${{ secrets.ZOS_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass -qq
          mkdir -p ~/.ssh && echo -e "Host *\n  StrictHostKeyChecking no" > ~/.ssh/config
          sshpass -p "$ZOS_PASSWORD" scp -o StrictHostKeyChecking=no $ZOS_USER@$ZOS_HOST:~/wazi-deploy-package/deployable.tar ./deployable.tar
          ls -l deployable.tar
          tar -tvf deployable.tar

      - name: Publish to JFrog
        env:
          JFROG_URL: ${{ secrets.JFROG_URL }}
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          if [ -z "$JFROG_URL" ]; then
            echo "JFROG not set, artifact ready"
            ls -l deployable.tar
            exit 0
          fi
          TARGET="$JFROG_URL/artifactory/mainframe-loads-local/core-banking-app/${{ env.BUILD_VERSION }}/deployable.tar"
          echo "Uploading to $TARGET"
          curl -f -u "$JFROG_USER:$JFROG_TOKEN" -T deployable.tar "$TARGET"
          echo "✅ Published to JFrog: core-banking-app/${{ env.BUILD_VERSION }}/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-banking-app-${{ env.BUILD_VERSION }}-deployable
          path: deployable.tar
          retention-days: 90

      - name: Summary
        run: |
          echo "## 📦 Package + Publish - Production" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** ${{ env.APP_NAME }} ${{ env.BUILD_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pattern:** BuildReport.json → ApplicationManifest (dynamic)" >> $GITHUB_STEP_SUMMARY
          echo "- **JFrog:** mainframe-loads-local/core-banking-app/${{ env.BUILD_VERSION }}/" >> $GITHUB_STEP_SUMMARY