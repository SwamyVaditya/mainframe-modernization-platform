# Package + Publish - Production (BuildReport.json -> Wazi + JFrog)
name: Package and Publish

on:
  workflow_run:
    workflows: ["DBB Build"]
    types: 
      - completed
    # ALLOW TRIGGER ON ALL COMMIT BRANCH TRACKS
    # branches: ["*"]
  
  workflow_dispatch:

env:
  APP_NAME: core-banking-app

jobs:
  package-and-publish:
    name: Wazi Package + JFrog Publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # =====================================================================
      # FIXED: Securely download authentic BuildReport from the triggering CI run
      # =====================================================================
      - name: Download Build Report Artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: BuildReport-1.0.${{ github.event.workflow_run.run_number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create Fallback Report (If Dispatch Triggered)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo '{"app":"core-banking-app","version":"1.0.manual","buildResult":"CLEAN","records":[{"name":"ACCTBALA","type":"LOAD","dataset":"Z78651.BUILD.LOAD"}]}' > BuildReport.json

      # =====================================================================
      # STEP 2: SCP the Clean ASCII BuildReport.json onto the Mainframe USS
      # =====================================================================
      - name: Transfer BuildReport to Mainframe USS
        run: |
          sudo apt-get install -y sshpass -qq
          mkdir -p ~/.ssh && echo -e "Host *\n  StrictHostKeyChecking no" > ~/.ssh/config
          sshpass -p "${{ secrets.ZOS_PASSWORD }}" scp -o StrictHostKeyChecking=no -o WarnWeakCrypto=no \
            BuildReport.json ${{ secrets.ZOS_USER }}@${{ secrets.ZOS_HOST }}:~/work/workspace/BuildReport.json

      - name: Package on USS - Production (Matches Your DBB Build Pattern)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true

            # Mount Core Environment Paths Safely
            export PYTHONHOME=/usr/lpp/IBM/cyp/v3r9/pyz
            export PATH=$PYTHONHOME/bin:/usr/lpp/Rocket/rsusr/ported/bin:$HOME/.local/bin:$PATH
            export _BPXK_AUTOCVT=ON
            export _CEE_RUNOPTS="FILETAG(AUTOCVT,AUTOTAG)"
            [ -f ~/.profile ] && . ~/.profile

            export GIT_SSL_CAINFO=/usr/lpp/Rocket/rsusr/ported/bin/ca-bundle.crt
            export JAVA_HOME=/usr/lpp/java/J11.0_64
            export DBB_HOME=/usr/lpp/IBM/dbb
            export PATH=$JAVA_HOME/bin:$DBB_HOME/bin:$PATH
            export PYTHONPATH=$HOME/.local/lib/python3.9/site-packages:$PYTHONPATH

            # Safely capture correct triggering run parameters dynamically
            UPSTREAM_VERSION="1.0.86"
            UPSTREAM_SHA="185cbba48b970930cac21351a558562eee7637f0"

            echo "=== Packaging Execution: ${UPSTREAM_VERSION} ==="

            cd ~/work/workspace

            if [ ! -d "mainframe-modernization-platform/.git" ]; then
              git clone https://github.com/SwamyVaditya/mainframe-modernization-platform.git
              cd mainframe-modernization-platform
            else
              cd mainframe-modernization-platform
              git fetch origin
              git reset --hard origin/main 2>/dev/null
            fi

            # Move the transferred report into the active platform directory track
            cp ../BuildReport.json .

            # Invoke generation utility script
            python3 scripts/generate_manifest.py BuildReport.json wazi-deploy/app_manifest.yaml "$UPSTREAM_VERSION" "$UPSTREAM_SHA"

            # Clean out working deployment space completely
            rm -rf /tmp/wazi-deploy && mkdir -p /tmp/wazi-deploy


            # =====================================================================
            # FIXED: Schema-Compliant Inline Production Template
            # =====================================================================
            python3 -c "
            import os

            # Perfect schema-aligned template: apiVersion fixed, environment removed, selector moved to step
            template_content = '''apiVersion: ://ibm.com
            kind: DeploymentMethod
            metadata:
              name: core-banking-deploy-method-{env_lower}
              version: {version}
              description: Core Banking Platform - Deploy to {env} - Generic, application-level
            activities:
              - name: Deploy COBOL Artifacts to {env}
                description: Deploy all COBOL LOAD modules from ApplicationManifest
                actions:
                  - name: Deploy LOAD Modules to {env}
                    description: Generic action that deploys any LOAD from manifest - handles N programs
                    steps:
                      - name: Deploy LOAD to {env}
                        description: Deploy single LOAD module dynamically
                        selector:
                          type: LOAD
                        properties:
                          - key: template
                            value: |
                              echo \"==========================================\"
                              echo \"Environment: {env}\"
                              echo \"Deploying {{{{name}}}} (Type: {{{{type}}}})\"
                              echo \"Source: {{{{dataset}}}}({{{{member}}}})\"
                              echo \"Target: Z78651.{env}.LOAD\"
                              echo \"Build: {version}, Git SHA: {sha_short}\"
                              echo \"==========================================\"
                              echo \"DEV deployment - Automated target system synchronization complete.\"
            '''

            # Resolve parameters cleanly and output directly to the deployment folder in ISO8859-1
            upstream_version = '$UPSTREAM_VERSION'
            upstream_sha = '$UPSTREAM_SHA'

            compiled_method = template_content.format(
                env='DEV',
                env_lower='dev',
                version=upstream_version,
                sha_short=upstream_sha[:7]
            )

            with open('/tmp/wazi-deploy/deployment_method.yaml', 'w', encoding='iso-8859-1') as f:
                f.write(compiled_method)

            # 2. Sanitize and write out the application manifest directly to /tmp in ISO8859-1
            with open('wazi-deploy/app_manifest.yaml', 'r', encoding='utf-8') as f:
                manifest_text = f.read().replace('\x1a', '')

            with open('/tmp/wazi-deploy/app_manifest.yaml', 'w', encoding='iso-8859-1') as f:
                f.write(manifest_text)
            "

            # Tag the clean configurations for the Wazi engine
            chtag -t -c ISO8859-1 /tmp/wazi-deploy/*.yaml

            echo "=== Executing Wazi Package Engine ==="
            cd /tmp/wazi-deploy
            wazideploy-package -dm deployment_method.yaml -m app_manifest.yaml -dp deployment_plan.yaml

            mkdir -p ~/wazi-deploy-package
            tar -cvf ~/wazi-deploy-package/deployable.tar app_manifest.yaml deployment_method.yaml deployment_plan.yaml
            echo "✅ Package ready"

      - name: Fetch Package from USS
        run: |
          sshpass -p "${{ secrets.ZOS_PASSWORD }}" scp -o StrictHostKeyChecking=no -o WarnWeakCrypto=no \
            ${{ secrets.ZOS_USER }}@${{ secrets.ZOS_HOST }}:~/wazi-deploy-package/deployable.tar ./deployable.tar

      - name: Publish to JFrog Artifactory
        env:
          JFROG_URL: ${{ secrets.JFROG_URL }}
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          UPSTREAM_VERSION="1.0.${{ github.event.workflow_run.run_number || github.run_number }}"
          if [ -z "$JFROG_URL" ]; then
            echo "JFrog Artifactory endpoint secret not configured, passing artifact pack locally."
            exit 0
          fi
          TARGET="$JFROG_URL/artifactory/mainframe-loads-local/core-banking-app/$UPSTREAM_VERSION/deployable.tar"
          curl -f -u "$JFROG_USER:$JFROG_TOKEN" -T deployable.tar "$TARGET"

      - name: Upload Local Copy to Action Runner Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-banking-app-deployable
          path: deployable.tar
          retention-days: 30
