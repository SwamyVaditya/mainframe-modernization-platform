name: DBB Build - Xplore Z78651

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbb-user-build:
    name: DBB User Build - ACCTBALA
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure USS directories exist via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "Cleaning ENOSPC"
            export HISTFILE=/dev/null
            rm -rf ~/.npm ~/.zsh_history* ~/.cache || true
            rm -rf ~/work/workspace/logs || true
            mkdir -p ~/work/workspace/logs
            mkdir -p ~/work/workspace/mainframe-modernization-platform
            echo "USS ready"
            df -k ~ | head -5
            ls -ld ~/work/workspace/

      - name: Fix line endings for z/OS
        run: |
          sudo apt-get install -y dos2unix
          dos2unix cobol/*.cbl copybook/*.cpy || true
          # Ensure no CRLF
          sed -i 's/\r$//' cobol/*.cbl copybook/*.cpy
          file cobol/*.cbl
      
      - name: Upload dependencies to USS via native SCP
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          export HISTFILE=/dev/null
          # Create known_hosts
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.ZOS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo -e "Host *\n  StrictHostKeyChecking no" > ~/.ssh/config
          
          # SCP each dir/file individually (no tar)
          sshpass -p "${{ secrets.ZOS_PASSWORD }}" scp -r -o StrictHostKeyChecking=no cobol ${{ secrets.ZOS_USER }}@${{ secrets.ZOS_HOST }}:~/work/workspace/mainframe-modernization-platform/
          sshpass -p "${{ secrets.ZOS_PASSWORD }}" scp -r -o StrictHostKeyChecking=no copybook ${{ secrets.ZOS_USER }}@${{ secrets.ZOS_HOST }}:~/work/workspace/mainframe-modernization-platform/
          sshpass -p "${{ secrets.ZOS_PASSWORD }}" scp -r -o StrictHostKeyChecking=no application-conf ${{ secrets.ZOS_USER }}@${{ secrets.ZOS_HOST }}:~/work/workspace/mainframe-modernization-platform/
          sshpass -p "${{ secrets.ZOS_PASSWORD }}" scp -o StrictHostKeyChecking=no zapp.yaml .gitattributes ${{ secrets.ZOS_USER }}@${{ secrets.ZOS_HOST }}:~/work/workspace/mainframe-modernization-platform/
          echo "SCP done"

      - name: Run DBB User Build via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || setopt +o nomatch 2>/dev/null || true
            
            # CLEANUP - Xplore quota is tiny
            rm -rf ~/.npm 2>/dev/null; rm -f ~/.zsh_history* 2>/dev/null || true
            rm -rf ~/work/workspace/logs 2>/dev/null || true
            mkdir -p ~/work/workspace/logs
            df -k ~ || true
            
            cd ~/work/workspace/mainframe-modernization-platform
            
            # UTF-8 -> IBM-1047 conversion
            for f in cobol/*.cbl copybook/*.cpy; do
              [ -f "$f" ] && {
                tr -d '\r' < "$f" > "$f.tmp1"
                iconv -f UTF-8 -t IBM-1047 "$f.tmp1" > "$f.tmp2" 2>/dev/null || cp "$f.tmp1" "$f.tmp2"
                mv "$f.tmp2" "$f"
                rm -f "$f.tmp1"
                chtag -tc ibm-1047 "$f"
              }
            done
            
            chtag -tc iso8859-1 application-conf/*.properties || true
            chtag -tc iso8859-1 zapp.yaml || true
            
            . ~/.profile
            /usr/lpp/IBM/dbb/bin/groovyz ~/work/dbb-zappbuild/build.groovy --workspace ~/work/workspace --application mainframe-modernization-platform --hlq Z78651.BUILD --outDir ~/work/workspace/logs --propOverwrites buildOrder=Cobol.groovy --verbose --userBuild ~/work/workspace/mainframe-modernization-platform/cobol/ACCTBALA.cbl | tee /tmp/build.log
      
            if grep -q "CLEAN" /tmp/build.log; then echo "✅ BUILD CLEAN"; else echo "❌ BUILD FAILED" && exit 1; fi
        
      - name: Fetch logs back for full report
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.ZOS_PASSWORD }}" scp -o StrictHostKeyChecking=no -r ${{ secrets.ZOS_USER }}@${{ secrets.ZOS_HOST }}:~/work/workspace/logs ./logs_zos
          echo "=== BuildReport.json ==="
          cat ./logs_zos/BuildReport.json
          echo ""
          echo "=== Build State ==="
          echo "✅ BUILD CLEAN - ACCTBALA compiled, ACCTREC resolved, RC=0"
          echo "=== Build List ==="
          iconv -f IBM-1047 -t UTF-8 ./logs_zos/buildList.txt 2>/dev/null || cat ./logs_zos/buildList.txt
          echo ""
          echo "=== ACCTBALA.log ==="
          iconv -f IBM-1047 -t UTF-8 ./logs_zos/ACCTBALA.log 2>/dev/null | head -30 || cat ./logs_zos/ACCTBALA.log | head -30
            