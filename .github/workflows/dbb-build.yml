name: DBB Build - Xplore Z78651

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DBB_WORKSPACE: /z/z78651/work/workspace
  DBB_HLQ: Z78651.BUILD
  APPLICATION: mainframe-modernization-platform

jobs:
  dbb-user-build:
    name: DBB User Build - ACCTBALA
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            cobol:
              - cobol/**/*.cbl
              - copybook/**/*.cpy
              - application-conf/**
              - zapp.yaml
              - .gitattributes

      - name: Ensure USS directories exist via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "Creating USS directories"
            mkdir -p /z/z78651/work/workspace/logs
            mkdir -p /z/z78651/work/workspace/mainframe-modernization-platform/cobol
            mkdir -p [STRIPPED 71 bytes] -p [STRIPPED 74 bytes]
            ls -ld /z/z78651/work/workspace/mainframe-modernization-platform/
            echo "USS ready"

      - name: Upload dependencies to USS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          source: "cobol/,copybook/,application-conf/,zapp.yaml,.gitattributes"
          target: "/z/z78651/work/workspace/mainframe-modernization-platform/"
          strip_components: 0
          rm: false
          overwrite: true
          debug: true

      - name: Run DBB User Build via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "=== DBB Build for ACCTBALA.cbl ==="
            mkdir -p /z/z78651/work/workspace/logs
            export HISTFILE=/dev/null
            cd /z/z78651/work/workspace/mainframe-modernization-platform
            chtag -tc ibm-1047 cobol/*.cbl || true
            chtag -tc ibm-1047 copybook/*.cpy || true
            chtag -tc iso8859-1 application-conf/*.properties || true
            chtag -tc iso8859-1 zapp.yaml || true
            . ~/.profile
            /usr/lpp/IBM/dbb/bin/groovyz /z/z78651/work/dbb-zappbuild/build.groovy --workspace /z/z78651/work/workspace --application mainframe-modernization-platform --hlq Z78651.BUILD --outDir /z/z78651/work/workspace/logs --propOverwrites buildOrder=Cobol.groovy --verbose --userBuild [STRIPPED 72 bytes].cbl
            echo "=== Build finished ==="
            cat /z/z78651/work/workspace/logs/BuildReport.json
            echo "=== ACCTBALA.log tail ==="
            cat /z/z78651/work/workspace/logs/ACCTBALA.log | tail -50 || true

      - name: Check Build State
        if: always()
        run: |
          echo "Check logs above for Build State CLEAN"
          echo "If ACCTREC resolved true and 1 file processed, CI passes"