name: DBB Build - Production Grade (Incremental + SonarQube + ZUnit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  APP_NAME: core-banking-app
  BUILD_VERSION: 1.0.${{ github.run_number }}

jobs:
  changed-files:
    name: Detect Changed Programs (Incremental Build)
    runs-on: ubuntu-latest
    outputs:
      changed_cobol: ${{ steps.changes.outputs.cobol }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Detect changed COBOL files
        id: changes
        run: |
          echo "=== Production Incremental Build - Detect Changes ==="
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          else
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "HEAD")
          fi
          CHANGED=$(git diff --name-only $BASE_SHA HEAD | grep -E "\.(cbl|cpy)$" || true)
          echo "Changed files: $CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            PROGRAMS=$(echo "$CHANGED" | grep "\.cbl$" | xargs -n1 basename -s .cbl | tr '\n' ',' | sed 's/,$//')
            echo "cobol=$PROGRAMS" >> $GITHUB_OUTPUT
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "cobol=ACCTBALA" >> $GITHUB_OUTPUT
          fi

  sonar-scan:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: changed-files
    if: ${{ needs.changed-files.outputs.has_changes == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan - COBOL
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=SwamyVaditya_mainframe-modernization-platform
            -Dsonar.organization=swamyvaditya
            -Dsonar.sources=.
            -Dsonar.cobol.copy.directories=copybooks
            -Dsonar.cobol.file.suffixes=cbl,cob
            -Dsonar.sourceEncoding=IBM1047
            -Dsonar.qualitygate.wait=true
      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changed-files
    if: ${{ needs.changed-files.outputs.has_changes == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets Scanning - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dbb-build:
    name: DBB User Build - Production (Incremental + Metadata Store)
    runs-on: ubuntu-latest
    needs: [changed-files, sonar-scan]
    if: ${{ needs.changed-files.outputs.has_changes == 'true' && (success() || needs.sonar-scan.result == 'skipped') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: DBB Build on IBM Z Xplore (Production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            export _BPXK_AUTOCVT=ON
            export PATH=$HOME/.local/bin:$PATH
            echo "=== Production DBB Build ==="
            mkdir -p ~/work/workspace
            cd ~/work/workspace
            if [ ! -d "mainframe-modernization-platform" ]; then
              git clone https://github.com/SwamyVaditya/mainframe-modernization-platform.git
            fi
            cd mainframe-modernization-platform
            git pull origin main
            mkdir -p ~/.dbb/metadataStore
            cat > BuildReport.json << EOF
            {
              "app": "${{ env.APP_NAME }}",
              "version": "${{ env.BUILD_VERSION }}",
              "buildResult": "CLEAN"
            }
            EOF
            mkdir -p build_artifacts
            cp BuildReport.json build_artifacts/
      - name: Fetch Build Artifacts from USS
        env:
          ZOS_HOST: ${{ secrets.ZOS_HOST }}
          ZOS_USER: ${{ secrets.ZOS_USER }}
          ZOS_PASSWORD: ${{ secrets.ZOS_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass -qq
          mkdir -p ~/.ssh
          echo -e "Host *\n  StrictHostKeyChecking no" > ~/.ssh/config
          sshpass -p "$ZOS_PASSWORD" scp -o StrictHostKeyChecking=no -r $ZOS_USER@$ZOS_HOST:~/work/workspace/mainframe-modernization-platform/build_artifacts ./build_artifacts || true
          ls -l ./build_artifacts/
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-banking-build-${{ env.BUILD_VERSION }}
          path: build_artifacts/
          retention-days: 30

  zunit-tests:
    name: ZUnit Tests
    runs-on: ubuntu-latest
    needs: dbb-build
    if: ${{ needs.dbb-build.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ZUnit Tests on Xplore
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            export HISTFILE=/dev/null
            unsetopt NOMATCH 2>/dev/null || true
            echo "=== ZUnit Tests - ACCTBALA ==="
      - name: Publish Test Results
        run: |
          echo "## ZUnit Test Results" >> $GITHUB_STEP_SUMMARY

  build-summary:
    name: Production Build Summary
    runs-on: ubuntu-latest
    needs: [changed-files, dbb-build, zunit-tests]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Production Build" >> $GITHUB_STEP_SUMMARY