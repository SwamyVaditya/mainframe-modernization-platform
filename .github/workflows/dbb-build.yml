name: DBB Build - Xplore Z78651

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DBB_WORKSPACE: /z/z78651/work/workspace
  DBB_HLQ: Z78651.BUILD
  APPLICATION: mainframe-modernization-platform

jobs:
  dbb-user-build:
    name: DBB User Build - ACCTBALA
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            cobol:
              - cobol/**/*.cbl
              - copybook/**/*.cpy
              - application-conf/**
              - zapp.yaml

      - name: Setup SSH key
        if: steps.changed.outputs.cobol_any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa || true
          chmod 600 ~/.ssh/id_rsa || true
          ssh-keyscan -H ${{ secrets.ZOS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo -e "Host *\n  StrictHostKeyChecking no" > ~/.ssh/config

      - name: Upload dependencies to USS via SCP
        if: steps.changed.outputs.cobol_any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          source: "cobol/,copybook/,application-conf/,zapp.yaml,.gitattributes"
          target: "/z/z78651/work/workspace/${{ env.APPLICATION }}/"
          strip_components: 0
          rm: false
          overwrite: true

      - name: Run DBB User Build via SSH
        if: steps.changed.outputs.cobol_any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "=== DBB Build for ACCTBALA.cbl ==="
            mkdir -p ${{ env.DBB_WORKSPACE }}/logs
            export HISTFILE=/dev/null
            cd ${{ env.DBB_WORKSPACE }}/${{ env.APPLICATION }}
            chtag -tc ibm-1047 cobol/*.cbl || true
            chtag -tc ibm-1047 copybook/*.cpy || true
            chtag -tc iso8859-1 application-conf/*.properties || true
            chtag -tc iso8859-1 zapp.yaml || true
            . ~/.profile
            /usr/lpp/IBM/dbb/bin/groovyz /z/z78651/work/dbb-zappbuild/build.groovy --workspace ${{ env.DBB_WORKSPACE }} --application ${{ env.APPLICATION }} --hlq ${{ env.DBB_HLQ }} --outDir ${{ env.DBB_WORKSPACE }}/logs --propOverwrites buildOrder=Cobol.groovy --verbose --userBuild ${{ env.DBB_WORKSPACE }}/${{ env.APPLICATION }}/cobol/ACCTBALA.cbl
            echo "=== Build finished ==="
            cat ${{ env.DBB_WORKSPACE }}/logs/BuildReport.json || true
            ls -lh ${{ env.DBB_WORKSPACE }}/logs/

      - name: Check Build State
        if: always()
        run: |
          echo "If Build State is CLEAN with 1 file, CI passes"