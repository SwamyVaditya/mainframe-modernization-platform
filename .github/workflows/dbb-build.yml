name: DBB Build - Xplore Z78651

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbb-user-build:
    name: DBB User Build - ACCTBALA
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure USS directories exist via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "Cleaning ENOSPC"
            export HISTFILE=/dev/null
            rm -rf ~/.npm ~/.zsh_history* ~/.cache || true
            rm -rf ~/work/workspace/logs || true
            mkdir -p ~/work/workspace/logs
            mkdir -p ~/work/workspace/mainframe-modernization-platform
            echo "USS ready"
            df -k ~ | head -5
            ls -ld ~/work/workspace/

      - name: Upload dependencies to USS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          source: "cobol/,copybook/,application-conf/,zapp.yaml,.gitattributes"
          target: "~/work/workspace/mainframe-modernization-platform/"
          strip_components: 0
          rm: false
          overwrite: false
          debug: false

      - name: Run DBB User Build via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZOS_HOST }}
          username: ${{ secrets.ZOS_USER }}
          password: ${{ secrets.ZOS_PASSWORD }}
          port: 22
          script: |
            set -e
            export HISTFILE=/dev/null
            cd ~/work/workspace/mainframe-modernization-platform
            chtag -tc ibm-1047 cobol/*.cbl || true
            chtag -tc ibm-1047 copybook/*.cpy || true
            chtag -tc iso8859-1 application-conf/*.properties || true
            chtag -tc iso8859-1 zapp.yaml || true
            . ~/.profile
            /usr/lpp/IBM/dbb/bin/groovyz ~/work/dbb-zappbuild/build.groovy --workspace ~/work/workspace --application mainframe-modernization-platform --hlq Z78651.BUILD --outDir ~/work/workspace/logs --propOverwrites buildOrder=Cobol.groovy --verbose --userBuild ~/work/workspace/mainframe-modernization-platform/cobol/ACCTBALA.cbl
            echo "=== Build finished ==="
            cat ~/work/workspace/logs/BuildReport.json